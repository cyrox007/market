name: Documentation links

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/check-doc-links.mjs'
      - 'scripts/check-openapi-routes.mjs'
      - 'services/backend/routes/api.php'
      - 'services/backend/public/api-docs/openapi.json'
      - '.github/workflows/docs-links.yml'
  push:
    branches: [develop]
    paths:
      - '**/*.md'
      - 'scripts/check-doc-links.mjs'
      - '.github/workflows/docs-links.yml'

permissions:
  contents: read

jobs:
  canonical-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify links in active docs
        run: node scripts/check-doc-links.mjs
      - name: Verify OpenAPI matches Laravel routes
        run: node scripts/check-openapi-routes.mjs
