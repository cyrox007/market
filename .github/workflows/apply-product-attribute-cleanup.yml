name: Apply product attribute cleanup

on:
  push:
    branches:
      - backend/product-attributes-normalization-tests
    paths:
      - '.github/workflows/apply-product-attribute-cleanup.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: backend/product-attributes-normalization-tests
          fetch-depth: 0

      - name: Apply deterministic patch
        run: python3 scripts/finish_product_attribute_normalization.py

      - name: Validate patch whitespace
        run: git diff --check

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/finish_product_attribute_normalization.py
          git rm .github/workflows/apply-product-attribute-cleanup.yml
          git add -A
          git commit -m "refactor(catalog): finish canonical color and size flow"
          git push origin HEAD:backend/product-attributes-normalization-tests
