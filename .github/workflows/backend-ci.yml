name: Backend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'services/backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci.yml'
  push:
    branches:
      - 'fix/**'
      - 'feature/**'
    paths:
      - 'services/backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, intl, zip, bcmath, gd
          coverage: none

      - name: Validate Composer manifest
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: PHP syntax check for integration job
        run: php -l app/Jobs/Integration/SyncOrderTo1CJob.php

      - name: Run Laravel tests
        run: php artisan test

      - name: Validate Docker Compose
        working-directory: .
        run: docker compose config --quiet
