name: Backend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'services/backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci.yml'
  push:
    branches:
      - 'fix/**'
      - 'feature/**'
    paths:
      - 'services/backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, intl, zip, bcmath, gd
          coverage: none

      - name: Validate Composer manifest
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare test application
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p public
          printf '<!doctype html><html><body>Backend CI</body></html>\n' > public/index.html

      - name: PHP syntax checks
        run: |
          php -l app/Jobs/Integration/SyncOrderTo1CJob.php
          php -l app/Http/Controllers/Api/AuthController.php
          php -l app/Console/Commands/Integration1CDoctorCommand.php
          php -l app/Console/Commands/EnqueueOrders1CSyncCommand.php

      - name: Validate Docker Compose
        working-directory: .
        run: docker compose config --quiet

      - name: Run Laravel tests
        run: php artisan test
