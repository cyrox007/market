name: Activity audit MySQL

on:
  pull_request:
    paths:
      - 'services/backend/**'
      - '.github/workflows/activity-audit-mysql.yml'
  push:
    branches: [develop]
    paths:
      - 'services/backend/**'
      - '.github/workflows/activity-audit-mysql.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: audit_test_root
          MYSQL_DATABASE: activity_audit_ci
          MYSQL_USER: audit_test
          MYSQL_PASSWORD: audit_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    defaults:
      run:
        working-directory: services/backend
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: activity_audit_ci
      DB_USERNAME: audit_test
      DB_PASSWORD: audit_test
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, sqlite3, bcmath, gd, exif, zip, dom, xml, xmlreader, xmlwriter, simplexml, curl, fileinfo
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Verify isolated database
        run: php -r '$pdo=new PDO("mysql:host=127.0.0.1;dbname=activity_audit_ci","audit_test","audit_test"); echo $pdo->query("SELECT VERSION()")->fetchColumn(), PHP_EOL;'
      - name: Audit feature tests on MySQL
        run: vendor/bin/phpunit tests/Feature/Admin/ActivityAuditTest.php
      - name: Bounded synthetic audit workload
        run: php artisan migrate --force && php tests/Manual/ActivityAuditMysqlSmoke.php
