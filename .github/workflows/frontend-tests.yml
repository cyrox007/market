name: Frontend build and tests

on:
  pull_request:
    paths:
      - 'apps/frontend/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend-tests.yml'
  push:
    branches: [develop]
    paths:
      - 'apps/frontend/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend-tests.yml'

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install workspace dependencies
        run: npm ci
      - name: Test frontend
        run: npm run test --workspace=apps/frontend
      - name: Build frontend
        run: npm run build --workspace=apps/frontend
